<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: students must be able to pinch-zoom (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Keep in sync with src/lib/brand.ts -->
    <title>Mandovi · Dempo</title>
    <meta name="description" content="Mandovi — exam-ready learning for Dempo. Coursework, timed quizzes and marks, with student data kept in India." />
    <meta name="theme-color" content="#0F626B" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Mandovi · Dempo" />
    <meta property="og:description" content="Exam-ready learning for Dempo. Coursework, timed quizzes and marks, with student data kept in India." />
    <meta property="og:type" content="website" />
    <!-- og:url / absolute og:image intentionally omitted until the production
         domain is decided; they previously pointed at an unrelated Replit app. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dempo crest" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mandovi · Dempo" />
    <meta name="twitter:description" content="Exam-ready learning for Dempo. Coursework, timed quizzes and marks, with student data kept in India." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts are loaded once, from src/index.css. -->
  </head>
  <body>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var dark =
            theme === "dark" ||
            ((!theme || theme === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
